name: Daily commit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add daily activity entry
        shell: bash
        run: |
          date -u +%F | while read -r day; do
            echo "- ${day}" >> activity.log
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- activity.log; then
            echo "No activity entry needed"
            exit 0
          fi

          day=$(date -u +%F)
          git add activity.log
          git diff --cached --quiet || git commit -m "Daily activity: ${day}"
          git push
